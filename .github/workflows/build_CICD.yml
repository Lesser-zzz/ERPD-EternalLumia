name: ERPD CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

  workflow_dispatch:
    inputs:
      build_target:
        description: '빌드할 타겟 플랫폼 선택'
        required: true
        default: 'none'
        type: choice
        options:
          - none (컴파일 검사만)
          - desktop
          - android
          - all

      build_type:
        description: '빌드 타입 선택 (디버그 또는 릴리스)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# 빌드 워크플로우는 저장소에 파일을 쓰지 않음
# master 직접 커밋/푸시도 하지 않도록 read 권한만 부여
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    # =====================================================================
    # Checkout
    # =====================================================================
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # =====================================================================
    # Debug Build
    # =====================================================================
    # workflow_dispatch에서 debug 빌드를 선택했을 경우
    # 버전명에 -INDEV를 붙여 개발용 빌드임을 표시
    - name: Debug 모드일 때만 INDEV 태그 자동 부착 (치트 활성화)
      if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug'
      shell: bash
      run: |
        sed -i "s/appVersionName = '\([^']*\)'/appVersionName = '\1-INDEV'/" build.gradle

    # =====================================================================
    # Java
    # =====================================================================
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # =====================================================================
    # Android SDK
    # =====================================================================
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # =====================================================================
    # Compile Check
    # =====================================================================
    # push / pull_request / workflow_dispatch의 기본 검사
    # 실제 패키징은 하지 않고 Java 컴파일만 수행
    - name: Compile check (Fast)
      run: .\gradlew.bat compileJava

    # =====================================================================
    # Desktop Build
    # =====================================================================
    - name: Build Desktop
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'desktop' || inputs.build_target == 'all')
      run: .\gradlew.bat desktop:jpackageImage

    # =====================================================================
    # Android Debug Build
    # =====================================================================
    - name: Build Android (Debug)
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'android' || inputs.build_target == 'all') && inputs.build_type == 'debug'
      run: .\gradlew.bat android:assembleDebug

    # =====================================================================
    # Android Release Build
    # =====================================================================
    - name: Build Android (Release)
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'android' || inputs.build_target == 'all') && inputs.build_type == 'release'
      run: .\gradlew.bat android:assembleRelease

    # =====================================================================
    # Android Release APK Signing
    # =====================================================================
    - name: Sign Android Release APK (Native)
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'android' || inputs.build_target == 'all') && inputs.build_type == 'release'
      shell: bash
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

        # Android SDK에 설치된 build-tools에서
        # apksigner / zipalign을 직접 검색
        APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner.bat" -o -name "apksigner" | head -n 1)
        ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name "zipalign.exe" -o -name "zipalign" | head -n 1)

        echo "Found apksigner: $APKSIGNER"
        echo "Found zipalign: $ZIPALIGN"

        APK_PATH=$(find android/build/outputs/apk/release -name "*.apk" | head -n 1)
        echo "Found APK: $APK_PATH"

        "$ZIPALIGN" -v -p 4 "$APK_PATH" aligned.apk

        "$APKSIGNER" sign \
          --ks keystore.jks \
          --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
          --ks-pass "pass:${{ secrets.STORE_PASSWORD }}" \
          --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
          aligned.apk

        mv aligned.apk "$APK_PATH"

        echo "Successfully signed Android Release APK!"

    # =====================================================================
    # Upload Desktop Artifact
    # =====================================================================
    - name: Upload Desktop Artifact
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'desktop' || inputs.build_target == 'all')
      with:
        name: erpd-desktop-${{ inputs.build_type }}
        path: desktop/build/jpackage/

    # =====================================================================
    # Upload Android Artifact
    # =====================================================================
    - name: Upload Android Artifact
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'android' || inputs.build_target == 'all')
      with:
        name: erpd-android-${{ inputs.build_type }}
        path: |
          android/build/outputs/apk/debug/*.apk
          android/build/outputs/apk/release/*.apk
