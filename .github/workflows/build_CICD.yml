name: ERPD CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
    
  workflow_dispatch:
    inputs:
      build_target:
        description: '빌드할 타겟 플랫폼 선택'
        required: true
        default: 'none'
        type: choice
        options:
          - none (컴파일 검사만)
          - desktop
          - android
          - all
      build_type:
        description: '빌드 타입 선택 (디버그 또는 릴리스)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

# 봇이 CHANGELOG.md를 수정하고 Push할 수 있도록 쓰기 권한 추가
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 👈 [수정됨] PR에 포함된 모든 커밋 메시지를 정확히 읽어오기 위해 0으로 변경

    # =====================================================================
    # 🌟 [추가된 핵심 로직] 🌟 
    # workflow_dispatch에서 'debug'를 선택했을 때만 build.gradle의 버전에 -INDEV를 몰래 붙임
    # =====================================================================
    - name: Debug 모드일 때만 INDEV 태그 자동 부착 (치트 활성화)
      if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'debug'
      shell: bash
      run: |
        sed -i "s/appVersionName = '\([^']*\)'/appVersionName = '\1-INDEV'/" build.gradle
    # =====================================================================

    # --- [체인지로그 자동화 스텝] ---
    # 👈 [수정됨] 브랜치명 추출 및 여러 커밋(제목+본문) 동시 반영 로직 적용
    - name: Update Changelog Automatically
      if: github.event_name == 'push'
      shell: bash
      run: |
        # 1. 한국 시간(KST) 설정
        CURRENT_TIME=$(TZ='KST-9' date +'%Y-%m-%d %H:%M:%S KST')
        
        # 2. 방금 Push(또는 Merge)로 인해 main에 추가된 '모든' 커밋 메시지 가져오기 (제목 + 본문 모두 포함)
        COMMIT_MSGS=$(git log ${{ github.event.before }}..${{ github.event.after }} --pretty=format:"- **%s** (%h)%n  %b")
        
        # 3. 브랜치 이름 추출하기
        LAST_COMMIT=$(git log -1 --pretty=format:"%s")
        BRANCH_NAME="main (Direct Push)"
        
        # 깃허브의 기본 병합 메시지에서 정규식으로 브랜치명만 추출
        if [[ "$LAST_COMMIT" =~ from\ [^/]+/([^ ]+) ]]; then
          BRANCH_NAME="${BASH_REMATCH[1]}"
        elif [[ "$LAST_COMMIT" =~ Merge\ branch\ \'([^\']+)\' ]]; then
          BRANCH_NAME="${BASH_REMATCH[1]}"
        fi
        
        # 4. 파일이 없으면 생성
        if [ ! -f CHANGELOG.md ]; then touch CHANGELOG.md; fi
        
        # 5. 임시 파일에 새 로그 작성 (브랜치명 포함!)
        echo "### 🕒 $CURRENT_TIME (Branch: \`$BRANCH_NAME\`)" > temp_changelog.md
        echo "$COMMIT_MSGS" >> temp_changelog.md
        echo "" >> temp_changelog.md
        echo "---" >> temp_changelog.md
        echo "" >> temp_changelog.md
        
        # 기존 로그를 아래에 덧붙이고 덮어쓰기
        cat CHANGELOG.md >> temp_changelog.md
        mv temp_changelog.md CHANGELOG.md
        
        # 6. 봇 계정으로 변경사항 자동 커밋 및 푸시 (무한루프 방지를 위해 [skip ci] 태그 추가)
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add CHANGELOG.md
        git commit -m "docs: 체인지로그 자동 업데이트 [skip ci]" || echo "No changes to commit"
        git push

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compile check (Fast)
      run: .\gradlew.bat compileJava

    - name: Build Desktop
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'desktop' || inputs.build_target == 'all')
      run: .\gradlew.bat desktop:jpackageImage

    - name: Build Android (Debug)
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'android' || inputs.build_target == 'all') && inputs.build_type == 'debug'
      run: .\gradlew.bat android:assembleDebug

      # =====================================================================
    # 🌟 [추가] Release 빌드 시 깃허브 금고에서 도장을 꺼내와 세팅하는 스텝
    # =====================================================================
    - name: Setup Release Keystore
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'android' || inputs.build_target == 'all') && inputs.build_type == 'release'
      shell: bash
      run: |
        # 1. 텍스트로 저장된 도장을 다시 안드로이드용 파일(.jks)로 복구
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore.jks
        # 2. SPD 엔진이 자동으로 도장을 찍도록 설정 파일(properties) 생성
        echo "storeFile=keystore.jks" > android/keystore.properties
        echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/keystore.properties

    # (이 아래에 원래 있던 Build Android (Release) 스텝이 오면 됩니다)
    - name: Build Android (Release)
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'android' || inputs.build_target == 'all') && inputs.build_type == 'release'
      run: .\gradlew.bat android:assembleRelease

    - name: Build Android (Release)
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'android' || inputs.build_target == 'all') && inputs.build_type == 'release'
      run: .\gradlew.bat android:assembleRelease

    - name: Upload Desktop Artifact
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'desktop' || inputs.build_target == 'all')
      with:
        name: erpd-desktop-${{ inputs.build_type }}
        path: desktop/build/jpackage/

    - name: Upload Android Artifact
      uses: actions/upload-artifact@v4
      if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'android' || inputs.build_target == 'all')
      with:
        name: erpd-android-${{ inputs.build_type }}
        path: |
          android/build/outputs/apk/debug/*.apk
          android/build/outputs/apk/release/*.apk
