name: Compile

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Compile Core
        run: ./gradlew core:compileJava

      - name: Compile Desktop
        run: ./gradlew desktop:compileJava

      - name: Compile Android
        run: ./gradlew android:compileDebugJavaWithJavac

      - name: Package Desktop
        run: ./gradlew desktop:distZip
